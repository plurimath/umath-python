name: Wheels

# Builds one release wheel per platform from the pinned native core (the
# same stage ci.yml proves on every push), replays the repository fixtures
# against the installed wheel, and uploads it as a workflow artifact.
# Publishing to PyPI is the separate, owner-gated publish.yml.

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - '.github/workflows/wheels.yml'
      - '.github/workflows/publish.yml'

permissions:
  contents: read

env:
  PLURIMATH_FULL_RAW_CORPUS: "1"

jobs:
  native:
    name: Native stage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
      - name: Install PyYAML with libyaml
        run: python -m pip install --disable-pip-version-check "--only-binary=:all:" pyyaml==6.0.3
      - name: Validate native source notice closure and the replay pin checks
        run: python -m unittest discover -s scripts/tests -v
      - name: Build the pinned public canonical stage once
        run: python scripts/ci.py build-native
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          include-hidden-files: true
          path: .native/*
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-evidence-${{ matrix.os }}
          path: .ci-evidence/*
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3
  installed:
    name: Release wheel (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: native
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: .native
      - name: Install the pinned public Python runtime and build the wheel
        run: python scripts/ci.py install-wheel
      - name: Test every repository fixture against the installed wheel
        run: python scripts/ci.py test-installed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.python }}
          include-hidden-files: true
          path: .ci-evidence/*
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/plurimath_umath-*.whl
          if-no-files-found: error
