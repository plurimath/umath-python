[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "umath"
version = "0.1.0"
description = "Shared PARG raw syntax runtime for umath"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["parsanol==0.1.23"]
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
umath = ["artifacts/*.json"]
